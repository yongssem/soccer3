  <style>
    /* ===== 무무월드컵 스타디움 디자인 토큰 ===== */
    :root {
      --trophy:        #FFC633; /* 트로피 옐로우 — 메인 CTA */
      --trophy-dark:   #E0A800;
      --p1:            #3B82F6; /* 플레이어 1 블루 */
      --p1-dark:       #1D4ED8;
      --p2:            #EF4444; /* 플레이어 2 레드 */
      --p2-dark:       #B91C1C;
      --grass-top:     #2E8B3D; /* 잔디 그라데이션 상단 */
      --grass-bottom:  #186A2A; /* 잔디 그라데이션 하단 */
      --pitch-line:    rgba(255,255,255,0.85); /* 라인 화이트 */
      --ink:           #F8FAFC; /* 스타디움 본문(밝은 글자) */
      --ink-muted:     rgba(248,250,252,0.72);
      --overlay:       rgba(6, 24, 12, 0.55); /* 가독성 오버레이 1겹 */
      --card-bg:       rgba(8, 30, 16, 0.66);
      --card-border:   rgba(255,255,255,0.14);
    }

    html, body { height: 100%; }
    body {
      margin: 0;
      font-family: 'Pretendard', sans-serif;
      color: var(--ink);
      -webkit-font-smoothing: antialiased;
    }

    /* 잔디 fallback 배경 (bg-landing.png 없을 때) */
    .stadium-bg {
      background:
        linear-gradient(var(--overlay), var(--overlay)),
        url('public/bg-landing.png'),
        linear-gradient(180deg, var(--grass-top) 0%, var(--grass-bottom) 100%);
      background-size: cover, cover, cover;
      background-position: center;
      background-repeat: no-repeat;
    }
    /* 잔디 줄무늬 (이미지 없어도 스타디움 느낌) */
    .pitch-stripes::before {
      content: '';
      position: absolute; inset: 0;
      background: repeating-linear-gradient(
        180deg,
        transparent 0, transparent 56px,
        rgba(255,255,255,0.045) 56px, rgba(255,255,255,0.045) 112px
      );
      pointer-events: none;
    }

    .stadium-card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      backdrop-filter: blur(6px);
      -webkit-backdrop-filter: blur(6px);
    }

    /* 입장 애니메이션 */
    @keyframes popIn {
      0%   { opacity: 0; transform: translateY(18px) scale(0.96); }
      100% { opacity: 1; transform: translateY(0) scale(1); }
    }
    .pop-in { animation: popIn 0.45s cubic-bezier(0.22, 1, 0.36, 1) both; }

    @keyframes floatBall {
      0%, 100% { transform: translateY(0) rotate(0deg); }
      50%      { transform: translateY(-12px) rotate(8deg); }
    }
    .float-ball { animation: floatBall 3s ease-in-out infinite; }

    .btn-press { transition: transform 0.08s ease; }
    .btn-press:active { transform: scale(0.96); }

    /* 음소거 토글 (우상단 고정) */
    #btn-mute {
      position: fixed; top: 10px; right: 12px; z-index: 60;
      width: 42px; height: 42px; border-radius: 999px;
      background: rgba(8,30,16,0.6); border: 1px solid rgba(255,255,255,0.22);
      font-size: 20px; line-height: 1; cursor: pointer;
      backdrop-filter: blur(4px); -webkit-backdrop-filter: blur(4px);
      transition: transform 0.08s ease;
    }
    #btn-mute:active { transform: scale(0.92); }

    /* 인풋 포커스 */
    .stadium-input {
      background: rgba(255,255,255,0.10);
      border: 2px solid rgba(255,255,255,0.18);
      color: var(--ink);
      transition: border-color 0.18s ease, background 0.18s ease;
    }
    .stadium-input::placeholder { color: rgba(248,250,252,0.45); }
    .stadium-input:focus { outline: none; background: rgba(255,255,255,0.16); }

    /* ===== 듀얼 패드 (좌우 동시 드래그) ===== */
    .pad {
      position: relative;
      flex: 1 1 0;
      overflow: hidden;
      touch-action: none;            /* 드래그 시 스크롤 방지 */
      user-select: none;
      -webkit-user-select: none;
    }
    .pad-divider { width: 3px; background: var(--pitch-line); opacity: 0.5; }
    .pad svg { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; }
    .anchor {
      position: absolute;
      transform: translate(-50%, -50%);
      font-size: 44px;
      line-height: 1;
      pointer-events: none;
      filter: drop-shadow(0 4px 6px rgba(0,0,0,0.4));
      transition: transform 0.05s linear;
    }
    .pad-gauge {
      position: absolute; left: 12px; right: 12px; bottom: 12px; height: 12px;
      border-radius: 999px;
      background: rgba(0,0,0,0.35);
      border: 1px solid rgba(255,255,255,0.2);
      overflow: hidden;
      pointer-events: none;
    }
    .pad-gauge > i {
      display: block; height: 100%; width: 0%;
      border-radius: 999px;
      transition: width 0.04s linear;
    }
    .ready-badge {
      position: absolute; top: 12px; left: 50%; transform: translateX(-50%);
      padding: 4px 14px; border-radius: 999px;
      background: var(--trophy); color: #1a1a1a; font-weight: 800; font-size: 14px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.3);
    }
    .pad-hint {
      position: absolute; top: 62%; left: 50%; transform: translate(-50%, -50%);
      text-align: center; pointer-events: none; width: 90%;
    }

    /* 시점 장면 (배경 이미지는 영역 채움) */
    .scene { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; pointer-events: none; }
    /* 배우(이미지) — 절대배치, 변형 애니메이션 대상 */
    .actor { position: absolute; pointer-events: none; line-height: 1; will-change: transform; }
    .figure-kicker { width: 120px; filter: drop-shadow(0 6px 7px rgba(0,0,0,0.45)); }
    .figure-keeper { width: 104px; filter: drop-shadow(0 6px 8px rgba(0,0,0,0.5)); will-change: transform; }
    .figure-kicker-far { width: 52px; filter: drop-shadow(0 2px 3px rgba(0,0,0,0.45)); opacity: 0.95; }
    .ball-fly { position: absolute; width: 34px; pointer-events: none; will-change: transform; }

    /* ===== 키퍼 골대 + 9구역 선택 ===== */
    .goal-frame {
      position: absolute; pointer-events: none;
      left: 15%; right: 15%; top: 14%; height: 42%;
    }
    .gf-kicker { left: 27%; right: 27%; top: 33%; height: 21%; }  /* 멀리 보이는 골대(원근) */
    .gf-keeper { left: 9%;  right: 9%;  top: 9%;  height: 40%; }  /* 키퍼 코앞 큰 골대 */
    .goal-net  {
      position: absolute; inset: 0; pointer-events: none;
      /* 다이아몬드 그물망 + 골대 안쪽 그늘 */
      background:
        repeating-linear-gradient(45deg,  rgba(255,255,255,0.45) 0 1.5px, transparent 1.5px 13px),
        repeating-linear-gradient(-45deg, rgba(255,255,255,0.45) 0 1.5px, transparent 1.5px 13px),
        linear-gradient(rgba(4,20,12,0.45), rgba(4,20,12,0.45));
      border: 5px solid #ffffff;        /* 기둥 + 크로스바 */
      border-bottom: none;              /* 골대 입구(바닥) 열림 */
      box-shadow: inset 0 0 0 1px rgba(0,0,0,0.25), 0 3px 7px rgba(0,0,0,0.4);
    }
    .zone-grid {
      position: absolute; inset: 0;
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      grid-template-rows: repeat(3, 1fr);
      gap: 4px; padding: 4px; pointer-events: none;
    }
    .zone-cell {
      pointer-events: auto; cursor: pointer; border-radius: 8px;
      border: 1.5px solid rgba(255,255,255,0.22);
      background: rgba(255,255,255,0.03);
      transition: background 0.12s ease, border-color 0.12s ease, transform 0.1s ease;
    }
    .zone-cell:hover { background: rgba(255,255,255,0.12); }
    .zone-cell.sel {
      background: rgba(255,198,51,0.40);
      border-color: var(--trophy);
      box-shadow: inset 0 0 0 2px var(--trophy);
    }

    /* ===== 키커 타이밍 스윕 라인 ===== */
    .sweep {
      position: absolute; pointer-events: none; opacity: 0; z-index: 5;
      border-radius: 2px; transition: opacity 0.15s ease;
    }
    .sweep-v { width: 3px; box-shadow: 0 0 8px currentColor; }
    .sweep-h { height: 3px; box-shadow: 0 0 8px currentColor; }

    /* 결과 오버레이 */
    .result-overlay {
      position: fixed; inset: 0; z-index: 50;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      background: rgba(4, 18, 9, 0.55);
      backdrop-filter: blur(3px); -webkit-backdrop-filter: blur(3px);
    }
    @keyframes resultPop {
      0%   { opacity: 0; transform: scale(0.4) rotate(-8deg); }
      60%  { opacity: 1; transform: scale(1.12) rotate(2deg); }
      100% { opacity: 1; transform: scale(1) rotate(0); }
    }
    .result-pop { animation: resultPop 0.5s cubic-bezier(0.22, 1, 0.36, 1) both; }
    @keyframes netShake {
      0%,100% { transform: translateX(0); }
      25% { transform: translateX(-2px); } 75% { transform: translateX(2px); }
    }
    /* 3D 에디션: 공통 UI와 캔버스 레이아웃 */
    body { background:#101e28; }
    #app { min-height:100svh; background:#101e28; }
    #app.pitch-stripes::before { display:none; }
    .landing3d { width:min(1240px,100%); margin:auto; padding:28px 40px 10px; }
    .brand3d { display:flex; align-items:center; gap:9px; font-size:18px; font-weight:900; letter-spacing:-.6px; }
    .brand3d b { color:#ffd354; }
    .brand-ball { font-size:25px; }
    .edition3d { margin-left:10px; padding:5px 9px; border:1px solid #43515a; border-radius:5px; font-size:9px; letter-spacing:1.5px; color:#a8bbc6; }
    .hero3d { display:grid; grid-template-columns:.85fr 1.15fr; align-items:center; gap:42px; padding:54px 0 38px; }
    .eyebrow3d { color:#a8c8bb; font-size:10px; font-weight:800; letter-spacing:2.4px; }
    .hero-copy h1 { font-size:clamp(42px,5.4vw,72px); line-height:1.16; margin:23px 0; font-weight:900; letter-spacing:-3.5px; }
    .hero-copy h1 em { color:#ffd354; font-style:normal; }
    .hero-copy p { color:#b4c3ca; line-height:1.9; font-size:14px; }
    .start3d { display:flex; align-items:center; justify-content:space-between; width:230px; padding:18px 23px; margin-top:30px; background:#ffd354; color:#14252a; border:0; border-radius:10px; font-weight:900; font-size:17px; cursor:pointer; }
    .start3d span { font-size:24px; line-height:1; }
    .hero-meta { display:flex; flex-wrap:wrap; gap:15px; margin-top:20px; font-size:10px; color:#81949f; }
    .hero-meta span:first-child { color:#a4c9ae; }
    .hero-stadium { position:relative; height:440px; border-radius:120px 14px 14px 14px; overflow:hidden; border:1px solid #577278; background:#abcbd4; box-shadow:0 30px 60px #0004; }
    #preview3d { width:100%; height:100%; display:block; }
    .live3d { position:absolute; top:22px; right:22px; background:#14252ccf; border:1px solid #ffffff30; border-radius:20px; padding:8px 12px; font-size:8px; font-weight:800; letter-spacing:1.5px; display:flex; gap:8px; align-items:center; }
    .live3d i { width:5px; height:5px; border-radius:50%; background:#bcff91; }
    .stadium-caption { position:absolute; bottom:0; left:0; right:0; padding:52px 24px 24px; background:linear-gradient(transparent,#14252cef); display:flex; flex-direction:column; gap:5px; }
    .stadium-caption b { font-size:17px; }.stadium-caption span { font-size:11px; color:#b0c7cb; }
    .how3d { display:flex; gap:40px; border-top:1px solid #31404a; padding:23px 0; color:#a6b7bf; font-size:12px; }
    .how3d b { color:#ffd354; font-size:10px; margin-right:12px; }
    .duel3d { width:100%; max-width:1500px; margin:auto; display:flex; gap:14px; padding:0 18px; }
    .player-view { flex:1; min-width:0; border:1px solid #33444c; border-radius:13px; overflow:hidden; background:#182b35; }
    .view-heading { padding:12px 16px; display:flex; justify-content:space-between; align-items:center; gap:8px; }
    .view-heading>div { min-width:0; display:flex; align-items:center; gap:9px; }
    .view-heading b { overflow:hidden; text-overflow:ellipsis; white-space:nowrap; font-size:14px; }
    .view-heading i { background:var(--player-color); width:7px; height:7px; border-radius:50%; flex-shrink:0; }
    .view-heading>span { font-size:9px; letter-spacing:1px; color:#a2b9c3; white-space:nowrap; }
    .pad { height:clamp(300px,calc(100svh - 290px),680px); cursor:crosshair; outline-offset:-3px; }
    .pad:focus-visible { outline:3px solid #ffd354; }
    .arena-canvas { position:absolute; inset:0; display:block; width:100%; height:100%; }
    .goal-frame { border:0; background:transparent; }
    .camera-tag { position:absolute; top:12px; left:12px; padding:5px 8px; background:#122431aa; border:1px solid #fff3; border-radius:4px; font-size:8px; letter-spacing:1.3px; pointer-events:none; }
    .pad-hint { top:auto; bottom:18px; transform:translateX(-50%); background:#102532df; width:max-content; max-width:92%; padding:10px 18px; border:1px solid #ffffff24; border-radius:9px; color:#fff; }
    .pad-hint .text-base { font-size:13px; }.pad-hint .text-xs { color:#ffd354; font-size:11px; }
    .ready-badge { top:auto; bottom:24px; padding:9px 19px; font-size:11px; letter-spacing:1.5px; z-index:6; }
    .sweep { background:#ffe36a; color:#ffe36a; }
    .glove-anchor { color:#ffe36a; font-size:46px; text-shadow:0 0 4px #1b332d; z-index:5; }
    .ball-anchor { display:none; }
    .view-bottom { display:flex; align-items:center; justify-content:space-between; padding:9px 13px; color:#9eb2bc; font-size:10px; }
    .view-bottom kbd { border:1px solid #ffffff30; border-radius:4px; padding:2px 6px; color:#d9e5e9; }
    .match-help { text-align:center; padding:14px 12px 0; font-size:11px; color:#8da5b0; }
    .match-help span { margin-left:14px; color:#c0cfd4; }
    .webgl-error { padding:45px 25px; font-size:14px; line-height:2; background:#172e38; color:white; }
    .webgl-error button { display:block; padding:8px 15px; margin-top:15px; border-radius:6px; background:#ffd354; color:#152c32; }
    @media(max-width:800px) {
      .landing3d { padding:22px; }.hero3d { gap:20px; padding:36px 0 28px; }.hero-stadium { height:390px; border-top-left-radius:70px; }
      .hero-copy h1 { font-size:48px; }.hero-copy p { font-size:12px; }.hero-meta { gap:8px; }.how3d { gap:20px; font-size:10px; }
    }
    @media(max-width:600px) and (orientation:portrait) {
      .hero3d { grid-template-columns:1fr; padding-top:30px; }.hero-copy h1 { font-size:48px; margin:15px 0; }.hero-stadium { height:280px; border-radius:50px 10px 10px 10px; }
      .start3d { margin-top:22px; width:100%; }.hero-meta { margin-top:15px; }.how3d { gap:12px; justify-content:space-between; }.how3d b { margin-right:4px; }
      .duel3d { flex-direction:column; padding:0 10px; gap:10px; }.pad { height:32svh; min-height:240px; }.view-heading { padding:8px 12px; }.view-bottom { padding:6px 12px; }
      .pad-hint { bottom:10px; padding:7px 12px; }.match-help span { display:block; margin:5px 0 0; }
    }
    @media(max-height:500px) and (orientation:landscape) {
      .pad { height:calc(100svh - 200px); min-height:185px; }.duel3d { gap:9px; padding:0 10px; }.view-heading { padding:6px 10px; }.view-bottom { padding:5px 9px; }
      .pad-hint { bottom:8px; padding:6px 10px; }.pad-hint .text-base { display:none; }.match-help { padding-top:8px; }
      #app>main>.px-4 { padding-top:5px; } #app .max-w-md.mb-6 { margin-bottom:8px; } #app>footer { padding:8px 0; }
    }
    @media(prefers-reduced-motion:reduce) { .float-ball,.result-pop,.pop-in { animation:none; } }
    /* 경기 중에는 카드를 걷어내고 두 카메라가 뷰포트 전체를 채운다. */
    #app.match-mode { height:100dvh; min-height:0; overflow:hidden; }
    .match-mode .match3d { position:absolute; inset:0; }
    .match-mode .duel3d { position:absolute; inset:0; max-width:none; height:100%; padding:0; margin:0; gap:2px; background:#122c37; }
    .match-mode .player-view { position:relative; border:0; border-radius:0; min-height:0; }
    .match-mode .pad { position:absolute; inset:0; height:100%; min-height:0; width:100%; }
    .match-mode .view-heading { position:absolute; z-index:7; top:max(16px,env(safe-area-inset-top)); left:20px; right:20px; padding:0; flex-direction:column; align-items:flex-start; gap:3px; pointer-events:none; text-shadow:0 1px 4px #000a; }
    .match-mode .player-view:last-child .view-heading { align-items:flex-end; }
    .match-mode .view-heading>div { padding:5px 9px; background:#142935bf; border:1px solid #ffffff30; border-radius:5px; }
    .match-mode .view-heading>span { padding:2px 5px; color:#edf6f9; }
    .match-mode .camera-tag { top:78px; left:20px; }
    .match-mode .view-bottom { position:absolute; bottom:27px; left:80px; right:80px; z-index:7; padding:0; justify-content:center; gap:8px; color:#fff; text-shadow:0 1px 4px #000; pointer-events:none; }
    .match-mode .view-bottom kbd { background:#142935a8; }
    .match-mode .pad-hint { bottom:70px; }
    .match-mode .ready-badge { bottom:80px; }
    .play-score { position:absolute; top:max(10px,env(safe-area-inset-top)); left:50%; transform:translateX(-50%); width:min(360px,43vw); z-index:9; pointer-events:none; }
    .play-score .max-w-md { margin-bottom:0; }
    .play-score .stadium-card { border-radius:10px; background:#102935dd; padding:6px 10px; box-shadow:0 3px 18px #0003; }
    .play-score .text-3xl { font-size:26px; line-height:1.05; }
    .play-score .text-sm { font-size:11px; }.play-score .text-lg { font-size:13px; }.play-score .mt-2 { margin-top:2px; font-size:11px; color:#fff; text-shadow:0 1px 3px #000; }
    .match-mode .match-help { display:none; }
    .match-mode>footer { position:absolute; bottom:0; left:0; right:0; z-index:8; padding:4px 6px; font-size:9px; background:#1026308c; pointer-events:auto; }
    .fullscreen3d { position:absolute; right:16px; bottom:30px; z-index:12; padding:8px 12px; border:1px solid #ffffff55; border-radius:7px; background:#142935cf; color:#fff; font-size:11px; font-weight:700; }
    body:has(.match-mode) #btn-mute { top:auto; right:auto; left:16px; bottom:30px; z-index:12; }
    @media(max-width:600px) and (orientation:portrait) {
      .match-mode .duel3d { flex-direction:column; }
      .match-mode .view-heading { top:12px; left:12px; right:12px; }
      .match-mode .player-view:last-child .view-heading { align-items:flex-start; }
      .match-mode .view-heading b { font-size:12px; }.match-mode .view-heading>span { font-size:8px; }
      .play-score { top:8px; width:44vw; left:auto; right:10px; transform:none; }
      .play-score .text-sm { font-size:9px; }.play-score .text-3xl { font-size:20px; }.play-score .px-3 { padding:0 4px; }
      .match-mode .camera-tag { top:72px; left:12px; font-size:7px; }

  </style>
</head>
<body>
  <div id="app" class="stadium-bg pitch-stripes relative min-h-screen flex flex-col"></div>

  <script type="module">
    let arenaFactory = null;
    let arena = null;
    let resizeInputs = null;
    let roundGeneration = 0;

    // ============================================================
    // 무무월드컵 3 — 3D 승부차기
    // 세션 상태 + 화면 라우팅 뼈대
    // ============================================================

    // ----- 세션 상태 (새로고침 시 초기화 = 한 판 단위) -----
    const gameState = {
      screen: 'landing',     // 'landing' | 'names' | 'play' | 'result'
      p1Name: '',
      p2Name: '',
      round: 1,
      p1Score: 0,
      p2Score: 0,
      kickerThisRound: 'p1',  // 'p1' | 'p2'
      history: [],            // [{ round, kicker, result }]
      suddenDeath: false,
      // --- 라운드 진행용 ---
      playStage: 'duel',
    };

    // 헬퍼: 키커/키퍼 정보
    const kickerKey = () => gameState.kickerThisRound;
    const keeperKey = () => (gameState.kickerThisRound === 'p1' ? 'p2' : 'p1');
    const nameOf  = (k) => gameState[k + 'Name'] || k.toUpperCase();
    const colorOf = (k) => (k === 'p1' ? 'var(--p1)' : 'var(--p2)');

    const app = document.getElementById('app');

    // ===== 사운드 (Web Audio API — 파일/라이브러리 없이 실시간 합성) =====
    const Sound = (() => {
      let ctx = null, master = null, muted = false, crowd = null, bgmTimer = null, bgmStep = 0;
      const ensure = () => {
        if (!ctx) {
          try { ctx = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { return null; }
          master = ctx.createGain(); master.gain.value = 1; master.connect(ctx.destination);
        }
        if (ctx.state === 'suspended') ctx.resume();
        return ctx;
      };
      // 단순 톤 (envelope 포함, slideTo 주면 주파수 글라이드)
      function tone(freq, dur, { type = 'sine', gain = 0.2, when = 0, slideTo = null } = {}) {
        const c = ensure(); if (!c || muted) return;
        const t0 = c.currentTime + when;
        const osc = c.createOscillator(), g = c.createGain();
        osc.type = type;
        osc.frequency.setValueAtTime(freq, t0);
        if (slideTo) osc.frequency.exponentialRampToValueAtTime(slideTo, t0 + dur);
        g.gain.setValueAtTime(0.0001, t0);
        g.gain.exponentialRampToValueAtTime(gain, t0 + 0.012);
        g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
        osc.connect(g).connect(master);
        osc.start(t0); osc.stop(t0 + dur + 0.03);
      }
      // 노이즈 버스트 (킥 임팩트 / 함성 / 휙)
      function noise(dur, { gain = 0.2, when = 0, freq = 1500, q = 0.7 } = {}) {
        const c = ensure(); if (!c || muted) return;
        const t0 = c.currentTime + when;
        const len = Math.floor(c.sampleRate * dur);
        const buf = c.createBuffer(1, len, c.sampleRate);
        const d = buf.getChannelData(0);
        for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
        const src = c.createBufferSource(); src.buffer = buf;
        const g = c.createGain(), f = c.createBiquadFilter();
        f.type = 'bandpass'; f.frequency.value = freq; f.Q.value = q;
        g.gain.setValueAtTime(gain, t0);
        g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
        src.connect(f).connect(g).connect(master);
        src.start(t0); src.stop(t0 + dur);
      }
      return {
        resume() { ensure(); },
        toggle() {
          muted = !muted; const c = ensure();
          if (c && master) master.gain.setTargetAtTime(muted ? 0 : 1, c.currentTime, 0.03);
          return muted;
        },
        // 관중 웅성임(루프 노이즈) + 가벼운 칩튠 BGM — 경기 시작 시 1회
        startAmbience() {
          const c = ensure(); if (!c) return;
          if (!crowd) {
            const len = Math.floor(c.sampleRate * 2);
            const buf = c.createBuffer(1, len, c.sampleRate);
            const d = buf.getChannelData(0);
            let last = 0;
            for (let i = 0; i < len; i++) { const w = Math.random() * 2 - 1; last = (last + 0.02 * w) / 1.02; d[i] = last * 3.2; } // brown noise
            const src = c.createBufferSource(); src.buffer = buf; src.loop = true;
            const f = c.createBiquadFilter(); f.type = 'bandpass'; f.frequency.value = 600; f.Q.value = 0.5;
            const g = c.createGain(); g.gain.value = 0.05;
            const lfo = c.createOscillator(), lg = c.createGain();   // 느린 웅성임 흔들기
            lfo.frequency.value = 0.13; lg.gain.value = 0.02; lfo.connect(lg).connect(g.gain); lfo.start();
            src.connect(f).connect(g).connect(master); src.start(); crowd = src;
          }
          if (!bgmTimer) {
            const LEAD = [523, 0, 659, 0, 784, 0, 659, 0, 880, 0, 784, 0, 659, 0, 587, 0];
            const BASS = [131, 0, 0, 0, 175, 0, 0, 0, 196, 0, 0, 0, 131, 0, 0, 0];
            bgmStep = 0;
            bgmTimer = setInterval(() => {
              const lead = LEAD[bgmStep], bass = BASS[bgmStep];
              if (lead) tone(lead, 0.15, { type: 'square', gain: 0.045 });
              if (bass) tone(bass, 0.22, { type: 'triangle', gain: 0.06 });
              bgmStep = (bgmStep + 1) % LEAD.length;
            }, 145);
          }
        },
        whistle() { tone(2050, 0.16, { type: 'square', gain: 0.1 }); tone(2300, 0.12, { type: 'square', gain: 0.09, when: 0.15 }); },
        tap()  { tone(620, 0.05, { type: 'triangle', gain: 0.1 }); },
        lock() { tone(900, 0.07, { type: 'square', gain: 0.1 }); },
        kick() { noise(0.11, { gain: 0.35, freq: 700, q: 0.5 }); tone(150, 0.12, { type: 'sine', gain: 0.3, slideTo: 55 }); },
        goal() { [523, 659, 784, 1046].forEach((f, i) => tone(f, 0.2, { type: 'square', gain: 0.13, when: i * 0.09 })); noise(0.9, { gain: 0.16, freq: 1400, q: 0.4, when: 0.1 }); },
        save() { tone(320, 0.18, { type: 'sawtooth', gain: 0.18, slideTo: 120 }); noise(0.16, { gain: 0.18, freq: 1200, q: 0.6 }); },
        post() { tone(1200, 0.06, { type: 'square', gain: 0.25, slideTo: 650 }); tone(170, 0.12, { type: 'sine', gain: 0.2, when: 0.02 }); },
        miss() { noise(0.4, { gain: 0.13, freq: 1800, q: 0.5 }); tone(520, 0.4, { type: 'sine', gain: 0.07, slideTo: 200 }); },
      };
    })();

    // ----- 라우터: screen 값에 따라 화면 렌더 -----
    function render() {
      app.classList.toggle('match-mode', gameState.screen === 'play');
      roundGeneration++;
      arena?.dispose(); arena = null;
      resizeInputs?.disconnect(); resizeInputs = null;
      if (sweepRAF) cancelAnimationFrame(sweepRAF);
      if (keeperRAF) cancelAnimationFrame(keeperRAF);
      const screens = {
        landing: renderLanding,
        names:   renderNames,
        play:    renderPlay,
        result:  renderPlaceholder,
      };
      const view = (screens[gameState.screen] || renderLanding)();
      app.querySelectorAll('[data-screen]').forEach((n) => n.remove());
      // 화면 + 푸터를 항상 같이
      app.insertAdjacentHTML('afterbegin', view + footer());
      bindEvents();
      bindFinishEvents();
    }

    function go(screen) {
      gameState.screen = screen;
      render();
    }

    // ----- 공통 푸터 (모든 화면 하단) -----
    function footer() {
      return `<footer data-screen class="mt-auto py-5 text-center text-xs" style="color:var(--ink-muted)">
        © 2026 <a href="https://www.mumuclass.kr/" target="_blank" rel="noopener noreferrer">무궁무진 클래스</a> · 용쌤
      </footer>`;
    }

    function renderLanding() {
      return `<main data-screen class="landing3d">
        <header class="landing-header"><div class="brand3d"><span class="brand-ball">⚽</span> 무무월드컵 <b>3</b><span class="edition3d">3D EDITION</span></div>
          <a class="instagram3d" href="https://www.instagram.com/yongssam.dev/" target="_blank" rel="noopener noreferrer">@yongssam.dev ↗</a></header>
        <div class="hero3d">
          <div class="hero-copy"><div class="eyebrow3d">OUR CLASS. OUR WORLD CUP.</div>
            <h1>승부는,<br>마지막 <em>한 킥.</em></h1>
            <p>키커의 한 방, 골키퍼의 한 수.<br>우리 반의 월드컵이 지금 시작됩니다.</p>
            <button id="btn-start" class="start3d btn-press">대결 시작 <span>↗</span></button>
            <div class="hero-meta"><span>● 같은 기기 2인</span><span>각 5번의 킥</span><span>터치 · 키보드</span></div>
            <div class="landing-actions"><button id="btn-share">↗ 공유하기</button><button id="btn-install">＋ 홈화면 설치</button><button id="btn-landing-fullscreen">⛶ 전체화면</button></div>
          </div>
          <div class="hero-art" aria-label="조명이 켜진 경기장에서 키커와 골키퍼가 맞서는 승부차기 장면"><span class="live3d"><i></i> MUMU STADIUM</span></div>
        </div>
        <div class="how3d"><span><b>01</b> 이름을 정하고</span><span><b>02</b> 좌우 · 높이 타이밍 탭</span><span><b>03</b> 골문을 흔들어요</span></div>
      </main>`;
    }

    // ----- 이름 입력 화면 -----
    function renderNames() {
      return `
        <main data-screen class="flex-1 flex flex-col items-center justify-center px-6">
          <div class="pop-in w-full max-w-sm">
            <h2 class="text-2xl font-bold text-center mb-6 drop-shadow">선수 이름을 정해줘</h2>

            <div class="stadium-card rounded-3xl p-6 space-y-5 shadow-2xl">
              <!-- P1 -->
              <div>
                <label class="flex items-center gap-2 mb-2 font-bold"
                       style="color: var(--p1);">
                  <span class="inline-block w-3 h-3 rounded-full" style="background: var(--p1);"></span>
                  플레이어 1
                </label>
                <input id="in-p1" type="text" maxlength="8" placeholder="P1"
                  class="stadium-input w-full rounded-xl px-4 py-3 text-lg font-semibold"
                  style="border-color: rgba(59,130,246,0.5);" value="${esc(gameState.p1Name)}" />
              </div>

              <!-- VS -->
              <div class="text-center font-black text-xl" style="color: var(--ink-muted);">VS</div>

              <!-- P2 -->
              <div>
                <label class="flex items-center gap-2 mb-2 font-bold"
                       style="color: var(--p2);">
                  <span class="inline-block w-3 h-3 rounded-full" style="background: var(--p2);"></span>
                  플레이어 2
                </label>
                <input id="in-p2" type="text" maxlength="8" placeholder="P2"
                  class="stadium-input w-full rounded-xl px-4 py-3 text-lg font-semibold"
                  style="border-color: rgba(239,68,68,0.5);" value="${esc(gameState.p2Name)}" />
              </div>
            </div>

            <button id="btn-play"
              class="btn-press w-full mt-6 px-8 py-4 rounded-2xl font-bold text-lg shadow-xl"
              style="background: var(--trophy); color: #1a1a1a;">
              ⚽ 경기 시작
            </button>

            <button id="btn-back"
              class="block mx-auto mt-3 text-sm underline" style="color: var(--ink-muted);">
              ← 뒤로
            </button>
          </div>
        </main>`;
    }

    // ===== play 화면 — 스코어보드 + 단계별 내용 (Phase 2~3) =====
    const TOTAL_ROUNDS = 5;

    function renderPlay() {
      // duel — 좌우 동시 드래그 (판정은 연출 오버레이로)
      return `
        <main data-screen class="match3d">
          <div class="play-score">${scoreboard()}</div>
          ${renderDuel()}
          <button id="btn-fullscreen" class="fullscreen3d" aria-label="전체화면 전환">⛶ 전체화면</button>
        </main>`;
    }

    // 상단 스코어보드 — 점수 + 라운드별 골/세이브 점
    function scoreboard() {
      return `
        <div class="w-full max-w-md mb-6">
          <div class="stadium-card rounded-2xl px-4 py-3 flex items-center justify-between">
            <div class="flex-1 text-center">
              <div class="text-sm font-bold truncate" style="color: var(--p1);">${esc(nameOf('p1'))}</div>
              <div class="text-3xl font-black">${gameState.p1Score}</div>
            </div>
            <div class="px-3 text-center">
              <div class="text-[10px] font-bold" style="color: var(--ink-muted);">ROUND</div>
              <div class="font-black text-lg">${gameState.suddenDeath ? 'SD ' + (gameState.round - TOTAL_ROUNDS) : gameState.round + '/' + TOTAL_ROUNDS}</div>
            </div>
            <div class="flex-1 text-center">
              <div class="text-sm font-bold truncate" style="color: var(--p2);">${esc(nameOf('p2'))}</div>
              <div class="text-3xl font-black">${gameState.p2Score}</div>
            </div>
          </div>
          <div class="flex justify-between mt-2 px-1 text-base">
            <div class="flex gap-1">${dots('p1')}</div>
            <div class="flex gap-1">${dots('p2')}</div>
          </div>
        </div>`;
    }

    // 한 선수의 5칸 결과 점 (⚽골 / 🧤세이브 / · 미진행)
    function dots(k) {
      const kicks = gameState.history.filter((h) => h.kicker === k);
      let out = '';
      for (let i = 0; i < TOTAL_ROUNDS; i++) {
        const r = kicks.slice(-TOTAL_ROUNDS)[i];
        const sym = !r ? '·'
          : r.result === 'goal' ? '⚽'
          : r.result === 'save' ? '🧤'
          : '❌';   // post / miss = 노골
        const op = r ? '' : 'opacity-30';
        out += `<span class="${op}">${sym}</span>`;
      }
      return out;
    }

    // ===== 듀얼 화면 — P1=왼쪽 / P2=오른쪽 고정, 역할만 교대 =====
    // 듀얼 중 두 패드의 선택을 임시 저장 (둘 다 차면 판정)
    let duelChoice = { p1: null, p2: null }; // {x, y, power}

    function renderDuel() {
      return `<div class="duel3d">
        ${pad('p1', kickerKey() === 'p1' ? 'kicker' : 'keeper')}
        ${pad('p2', kickerKey() === 'p2' ? 'kicker' : 'keeper')}
      </div>
      <div class="match-help">움직이는 조준선을 보고 두 번 탭! <span>P1: A · P2: L</span></div>`;
    }

    function pad(player, role) {
      const isKicker = role === 'kicker';
      return `<section class="player-view" style="--player-color:${colorOf(player)}">
        <div class="view-heading"><div><i></i><b>${esc(nameOf(player))}</b></div><span>${isKicker ? 'ATTACK / 키커' : 'DEFEND / 골키퍼'}</span></div>
        <div class="pad" id="pad-${player}" data-player="${player}" data-role="${role}" role="button" tabindex="0" aria-label="${esc(nameOf(player))} ${isKicker ? '슛' : '수비'} 타이밍 선택">
          <canvas class="arena-canvas" id="canvas-${player}" aria-label="${isKicker ? '키커' : '골키퍼'} 3D 시점"></canvas>
          <div class="camera-tag">${isKicker ? '↗ KICKER CAM' : '↙ KEEPER CAM'}</div>
          <div class="goal-frame" id="goalframe-${player}"></div>
          ${isKicker ? `<div class="sweep sweep-v" id="sweepv-${player}"></div><div class="sweep sweep-h" id="sweeph-${player}"></div>` : ''}
          <div class="anchor ${isKicker ? 'ball-anchor' : 'glove-anchor'}" id="anchor-${player}">${isKicker ? '' : '＋'}</div>
          <div class="pad-hint" id="hint-${player}"><div class="font-extrabold text-base">${isKicker ? '골문 구석을 노려요' : '공이 올 곳을 예측해요'}</div><div class="text-xs mt-1">① 좌우 타이밍 탭!</div></div>
          <div class="ready-badge" id="ready-${player}" style="display:none" role="status">READY ✓</div>
        </div>
        <div class="view-bottom"><span>${isKicker ? '두 번 탭해서 슛 위치 확정' : '두 번 탭해서 다이빙 위치 확정'}</span><kbd>${player === 'p1' ? 'A' : 'L'}</kbd></div>
      </section>`;
    }

    // ----- 듀얼 판정 + 연출 -----
    let resolving = false;
    let sweepRAF = null;    // 키커 타이밍 스윕 애니메이션 프레임
    let keeperRAF = null;   // 키퍼 글러브 왕복 애니메이션 프레임

    function resolveDuel() {
      if (resolving) return;
      resolving = true;
      const k = kickerKey(), g = keeperKey();
      const shot = duelChoice[k];   // {x,y}  슛 목표 (x:-1.3좌~1.3우, y:0바닥~1.3위)
      // 골키퍼는 골대 뒤에서 보므로 화면 좌우를 월드 좌우로 변환한다.
      const dive = { ...duelChoice[g], x: -duelChoice[g].x };   // {x,y}  키퍼 글러브 위치 (타이밍 2단계)

      // 1) 키퍼와 무관한 판정 먼저 — 골대 밖(miss) / 기둥·크로스바(post)
      const ax = Math.abs(shot.x);
      let outcome;  // 'goal' | 'save' | 'post' | 'miss'
      if (ax > 1.06 || shot.y > 1.06) {
        outcome = 'miss';   // 골대 밖으로 완전히 빗나감
      } else if (ax > 0.94 || shot.y > 0.94) {
        outcome = 'post';   // 골대 기둥/크로스바 맞고 노골
      } else {
        // 2) 골대 안 → 키퍼 글러브 거리로 골/세이브
        const reach = 0.32;                         // 글러브 닿는 범위 (좁게 = 정확히 맞춰야 막음)
        const dist = Math.hypot(shot.x - dive.x, shot.y - dive.y);
        outcome = dist > reach ? 'goal' : 'save';
      }

      const isGoal = outcome === 'goal';
      if (isGoal) gameState[k + 'Score'] += 1;
      gameState.history.push({ round: gameState.round, kicker: k, shot, dive, result: outcome });
      const generation = roundGeneration;
      animateDuel(k, g, shot, dive, outcome).then(() => {
        if (generation !== roundGeneration) return;
        resolving = false;
        showResult(outcome, k, shot);
      });
    }

    // 물리 월드 하나를 두 시점으로 렌더링한다.
    function animateDuel(k, g, shot, dive, outcome) {
      document.querySelectorAll('.sweep, .anchor').forEach(el => el.style.opacity = '0');
      return arena.play(shot, dive, outcome, Sound.kick);
    }

    // 결과 오버레이 (GOAL/SAVE/POST/MISS + 폭죽 + 다음 버튼)
    function showResult(outcome, k, shot) {
      const isLast = gameState.round >= TOTAL_ROUNDS && gameState.kickerThisRound === 'p2' && gameState.p1Score !== gameState.p2Score;
      // 결과별 연출 정보
      const view = {
        goal: { emoji: '🥅', title: 'GOAL!',  color: 'var(--trophy)', desc: `${esc(nameOf(k))} 득점! ⚽` },
        save: { emoji: '🧤', title: 'SAVE!',  color: '#ffffff',       desc: '골키퍼가 막아냈다!' },
        post: { emoji: '😫', title: 'POST!',  color: '#C8E6F5',       desc: '골대를 맞고 튕겨나갔다!' },
        miss: { emoji: '💨', title: 'MISS!',  color: '#94A3B8',       desc: '골대 밖으로 빗나갔다!' },
      }[outcome];

      if (Sound[outcome]) Sound[outcome]();   // 결과별 효과음 (goal/save/post/miss)
      const ov = document.createElement('div');
      ov.className = 'result-overlay';
      ov.setAttribute('data-screen', '');
      ov.innerHTML = `
        <div class="result-pop text-center px-6">
          <div class="text-7xl mb-2">${view.emoji}</div>
          <h2 class="text-6xl font-black mb-3 drop-shadow-lg" style="color: ${view.color};">
            ${view.title}
          </h2>
          <p class="text-base mb-6" style="color: var(--ink-muted);">${view.desc}</p>
          <button id="ov-next"
            class="btn-press px-10 py-4 rounded-2xl font-bold text-lg shadow-xl"
            style="background: var(--trophy); color: #1a1a1a;">
            ${isLast ? '🏆 최종 결과 보기' : '다음 킥 ▶'}
          </button>
        </div>`;
      app.appendChild(ov);
      document.getElementById('ov-next').onclick = () => { ov.remove(); advanceTurn(); };
      if (outcome === 'goal' && window.confetti) {
        window.confetti({ particleCount: 90, spread: 75, origin: { y: 0.4 },
          colors: ['#FFC633', '#FFD6E0', '#C8E6F5', '#3B82F6'] });
      }
    }

    // 판정 후 다음 차례로 — 역할 교대 / 라운드 진행 / 종료
    function advanceTurn() {
      duelChoice = { p1: null, p2: null };
      if (gameState.kickerThisRound === 'p1') {
        gameState.kickerThisRound = 'p2';   // 같은 라운드 역할 교대
        render();
      } else {
        gameState.kickerThisRound = 'p1';
        if (gameState.round >= TOTAL_ROUNDS && gameState.p1Score !== gameState.p2Score) {
          go('result');
        } else {
          gameState.round += 1;
          gameState.suddenDeath = gameState.round > TOTAL_ROUNDS;
          render();
        }
      }
    }

    // ----- result 화면 — 최종 점수 (우승 연출은 Phase 5) -----
    function renderPlaceholder() {
      const p1 = gameState.p1Score, p2 = gameState.p2Score;
      const tie = p1 === p2;
      const winK = p1 > p2 ? 'p1' : 'p2';

            </button>
          </div>
        </main>`;
    }

    // ----- 이벤트 바인딩 (렌더마다 재연결) -----
    function bindEvents() {
      const fullscreen = document.getElementById('btn-fullscreen');
      if (fullscreen) fullscreen.onclick = async () => {
        try {
          if (document.fullscreenElement) await document.exitFullscreen();
          else if (document.documentElement.requestFullscreen) await document.documentElement.requestFullscreen();
          else fullscreen.textContent = '브라우저 전체화면을 사용해 주세요';
        } catch { fullscreen.textContent = '브라우저 전체화면을 사용해 주세요'; }
      };
      const start = document.getElementById('btn-start');
      if (start) start.onclick = () => { Sound.resume(); Sound.tap(); go('names'); };

      const back = document.getElementById('btn-back');
      if (back) back.onclick = () => go('landing');

      const home = document.getElementById('btn-home');
      if (home) home.onclick = () => go('landing');

      const preview = document.getElementById('preview3d');
      try {
        if (preview && arenaFactory) arena = arenaFactory([{ canvas: preview }], 'p1', true);
        if (gameState.screen === 'play') {
          resolving = false;
          arena = arenaFactory(['p1', 'p2'].map(player => ({
            canvas: document.getElementById('canvas-' + player),
            frame: document.getElementById('goalframe-' + player),
            role: document.getElementById('pad-' + player).dataset.role,
          })), kickerKey());
          const setup = () => {
            if (resolving || !arena) return;
            arena.resize();
            ['p1', 'p2'].forEach(pl => {
              if (duelChoice[pl]) return;
              const el = document.getElementById('pad-' + pl);
              if (el.dataset.role === 'kicker') setupKicker(pl); else setupKeeper(pl);
            });
          };
          setup();
          resizeInputs = new ResizeObserver(setup);
          document.querySelectorAll('.pad').forEach(el => resizeInputs.observe(el));
        }
      } catch (error) {
        console.error('3D 경기장 초기화 실패', error);
        const target = document.querySelector('.duel3d') || document.querySelector('.hero-stadium');
        if (target) target.innerHTML = '<div class="webgl-error" role="alert">3D 경기장을 불러오지 못했어요.<br>브라우저의 하드웨어 가속을 켠 뒤 다시 열어주세요.<button onclick="location.reload()">다시 불러오기</button></div>';
      }

      const play = document.getElementById('btn-play');
      if (play) play.onclick = async () => {
        play.disabled = true; play.textContent = '경기장 준비 중…';
        try {
          if (!arenaFactory) arenaFactory = (await import('./public/arena3d.js')).createArena;
        } catch (error) {
          play.disabled = false; play.textContent = '연결을 확인하고 다시 시작';
          console.error('경기장 불러오기 실패', error); return;
        }
        const p1 = document.getElementById('in-p1').value.trim();
        const p2 = document.getElementById('in-p2').value.trim();
        gameState.p1Name = p1 || 'P1';   // 빈칸이면 기본값
        gameState.p2Name = p2 || 'P2';
        // 경기 전체 초기화 (다시 하기 대비)
        gameState.round = 1;
        gameState.p1Score = 0;
        gameState.p2Score = 0;
        gameState.history = [];
        gameState.suddenDeath = false;
        gameState.kickerThisRound = 'p1';
        gameState.playStage = 'duel';
        duelChoice = { p1: null, p2: null };
        Sound.whistle();        // 경기 시작 휘슬
        Sound.startAmbience();  // 관중 함성 + BGM
        go('play');
      };
    }

    // ===== 키커 타이밍 2단계 =====
    // ① 좌우로 움직이는 세로선 탭 → 가로 위치 / ② 상하로 움직이는 가로선 탭 → 세로 위치
    function setupKicker(player) {
      const padEl   = document.getElementById('pad-' + player);
      const ball    = document.getElementById('anchor-' + player);
      const vline   = document.getElementById('sweepv-' + player);
      const hline   = document.getElementById('sweeph-' + player);
      const hintEl  = document.getElementById('hint-' + player);
      const readyEl = document.getElementById('ready-' + player);
      const subEl   = hintEl ? hintEl.querySelector('.text-xs') : null;
      if (!padEl) return;
      if (sweepRAF) cancelAnimationFrame(sweepRAF);

      const display = padEl.getBoundingClientRect();
      const scale = display.width / padEl.clientWidth;
      const pr = { width:padEl.clientWidth, height:padEl.clientHeight };
      // 공 시작 위치 (하단 중앙)
      ball.style.left = (pr.width * 0.5) + 'px';
      ball.style.top  = (pr.height * 0.78) + 'px';
      ball.style.opacity = '0';

      // 골대 프레임 영역 (패드 기준) — 스윕 범위
      const gf = document.getElementById('goalframe-' + player).getBoundingClientRect();
      const gx0 = (gf.left - display.left) / scale, gy0 = (gf.top - display.top) / scale, gw = gf.width / scale, gh = gf.height / scale;

      // 스윕 범위를 골대보다 넓게 → 가장자리 타이밍이면 골대 밖/기둥(빗나감) 가능
      const mx = gw * 0.16, my = gh * 0.18;   // 좌우 / 위쪽 여유 (아래는 땅이라 X)
      vline.style.top = (gy0 - my) + 'px'; vline.style.height = (gh + my) + 'px'; vline.style.opacity = '0.95';
      hline.style.left = (gx0 - mx) + 'px'; hline.style.width = (gw + 2 * mx) + 'px'; hline.style.opacity = '0';

      let stage = 'x', lockedX = 0;
      const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
      const tri = (ts, period) => { const p = (ts % period) / period; return p < 0.5 ? p * 2 : 2 - p * 2; };

      function frame(ts) {
        if (!document.body.contains(padEl)) return;   // 화면 떠나면 정지
        if (stage === 'x')      vline.style.left = (gx0 - mx + tri(ts, 1300) * (gw + 2 * mx)) + 'px';
        else if (stage === 'y') hline.style.top  = (gy0 - my + tri(ts, 1100) * (gh + my)) + 'px';
        sweepRAF = requestAnimationFrame(frame);
      }
      frame(performance.now());

      padEl.onpointerdown = () => {
        if (!arena || resolving || duelChoice[player]) return;   // 이미 확정
        if (stage === 'x') {
          lockedX = clamp(((parseFloat(vline.style.left) - gx0) / gw) * 2 - 1, -1.3, 1.3);
          vline.style.opacity = '0.45';   // 가로 확정 (흐리게 고정)
          hline.style.opacity = '0.95';
          stage = 'y';
          Sound.tap();
          if (subEl) subEl.textContent = '↕ 상하 타이밍 탭!';
        } else {
          const lockedY = clamp(1 - (parseFloat(hline.style.top) - gy0) / gh, 0, 1.3);
          if (sweepRAF) cancelAnimationFrame(sweepRAF);
          hline.style.opacity = '0.45';
          duelChoice[player] = { x: lockedX, y: lockedY };
          Sound.lock();
          hintEl.style.opacity = '0';
          readyEl.style.display = 'block';
          if (duelChoice.p1 && duelChoice.p2) {
            setTimeout(() => { if (gameState.screen === 'play') resolveDuel(); }, 350);
          }
        }
      };
    }

    // ===== 키퍼 타이밍 2단계 (키커와 대칭) =====
    // 글러브가 좌우로 왔다리 갔다리 → 탭(가로 확정) → 상하로 왔다리 갔다리 → 탭(높이 확정)
    function setupKeeper(player) {
      const padEl   = document.getElementById('pad-' + player);
      const glove   = document.getElementById('anchor-' + player);
      const hintEl  = document.getElementById('hint-' + player);
      const readyEl = document.getElementById('ready-' + player);
      const subEl   = hintEl ? hintEl.querySelector('.text-xs') : null;
      if (!padEl) return;
      if (keeperRAF) cancelAnimationFrame(keeperRAF);

      const display = padEl.getBoundingClientRect();
      const scale = display.width / padEl.clientWidth;
      const pr = { width:padEl.clientWidth, height:padEl.clientHeight };
      const gf = document.getElementById('goalframe-' + player).getBoundingClientRect();
      const gx0 = (gf.left - display.left) / scale, gy0 = (gf.top - display.top) / scale, gw = gf.width / scale, gh = gf.height / scale;

      // 글러브 보이기 + 골대 중앙에서 시작
      glove.style.opacity = '1';
      glove.style.left = (gx0 + gw / 2) + 'px';
      glove.style.top  = (gy0 + gh / 2) + 'px';

      let stage = 'x', lockedX = 0;
      const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
      const tri = (ts, period) => { const p = (ts % period) / period; return p < 0.5 ? p * 2 : 2 - p * 2; };

      function frame(ts) {
        if (!document.body.contains(padEl)) return;   // 화면 떠나면 정지
        if (stage === 'x')      glove.style.left = (gx0 + tri(ts, 900) * gw) + 'px';   // 좌우 왕복
        else if (stage === 'y') glove.style.top  = (gy0 + tri(ts, 820) * gh) + 'px';   // 상하 왕복
        keeperRAF = requestAnimationFrame(frame);
      }
      frame(performance.now());

      padEl.onpointerdown = () => {
        if (!arena || resolving || duelChoice[player]) return;   // 이미 확정
        if (stage === 'x') {
          lockedX = clamp(((parseFloat(glove.style.left) - gx0) / gw) * 2 - 1, -1, 1);
          stage = 'y';
          Sound.tap();
          if (subEl) subEl.textContent = '↕ 높이 타이밍 탭!';
        } else {
          const lockedY = clamp(1 - (parseFloat(glove.style.top) - gy0) / gh, 0, 1);
          if (keeperRAF) cancelAnimationFrame(keeperRAF);
          duelChoice[player] = { x: lockedX, y: lockedY };
          Sound.lock();
          hintEl.style.opacity = '0';
          readyEl.style.display = 'block';
          if (duelChoice.p1 && duelChoice.p2) {
            setTimeout(() => { if (gameState.screen === 'play') resolveDuel(); }, 350);
          }
        }
      };
    }


    const SHARE_URL = 'https://soccer3-plum.vercel.app/';
    let installPrompt = null;
    window.addEventListener('beforeinstallprompt', event => { event.preventDefault(); installPrompt = event; });
    window.addEventListener('appinstalled', () => { installPrompt = null; });
    function fitStage() {
      const width = document.documentElement.clientWidth, height = window.innerHeight;
      const scaled = width <= 1280 || height < 720;
      const scale = Math.min(width/1280,height/720);
      app.classList.toggle('scaled-stage', scaled);
      app.style.setProperty('--stage-scale',scale);
      document.body.style.setProperty('--page-scale',scale);
      arena?.resize();
    }
    window.addEventListener('resize',fitStage); window.visualViewport?.addEventListener('resize',fitStage);
    function showNotice(title, message, copyValue = '') {
      document.querySelector('.finish-notice')?.remove();
      const previous = document.activeElement;
      const overlay = document.createElement('div'); overlay.className='finish-notice'; overlay.dataset.screen='';
      overlay.innerHTML=`<section class="finish-dialog" role="dialog" aria-modal="true" aria-labelledby="notice-title"><h2 id="notice-title">${esc(title)}</h2><p>${esc(message)}</p>${copyValue ? `<input readonly aria-label="복사할 게임 링크" value="${esc(copyValue)}">` : ''}<button>확인</button></section>`;
      const close=()=>{overlay.remove();previous?.focus();};
      overlay.querySelector('button').onclick=close;
      overlay.onkeydown=event=>{if(event.key==='Escape'){event.preventDefault();close();}if(event.key==='Tab'){const items=[...overlay.querySelectorAll('input,button')];if(items.length===1){event.preventDefault();items[0].focus();}else if(event.shiftKey && document.activeElement===items[0]){event.preventDefault();items.at(-1).focus();}else if(!event.shiftKey && document.activeElement===items.at(-1)){event.preventDefault();items[0].focus();}}};
      app.appendChild(overlay); const field=overlay.querySelector('input'); if(field){field.focus();field.select();}else overlay.querySelector('button').focus();
    }
    async function toggleFullscreen() {
      try {
        if(document.fullscreenElement) { await document.exitFullscreen(); return; }
        if(!document.documentElement.requestFullscreen) { showNotice('전체화면 안내','이 브라우저에서는 홈화면에 추가한 뒤 실행하거나 기기를 가로로 돌려 주세요.'); return; }
        await document.documentElement.requestFullscreen();
        try { await screen.orientation?.lock?.('landscape'); } catch { /* 잠금 미지원 환경은 같은 가로 스테이지를 축소한다. */ }
      } catch { showNotice('전체화면 안내','브라우저 메뉴의 전체화면을 사용하거나 기기를 가로로 돌려 주세요.'); }
    }
    function bindFinishEvents() {
      fitStage();
      for(const id of ['btn-fullscreen','btn-landing-fullscreen']) { const button=document.getElementById(id); if(button)button.onclick=toggleFullscreen; }
      const share=document.getElementById('btn-share');
      if(share) share.onclick=async()=>{
        if(navigator.share) {try {await navigator.share({title:'무무월드컵 3',text:'우리 반 키커왕은 누구? 함께 승부차기!',url:SHARE_URL});return;}catch(error){if(error.name==='AbortError')return;}}
        try {if(!navigator.clipboard?.writeText)throw new Error('clipboard unavailable');await navigator.clipboard.writeText(SHARE_URL);showNotice('링크 복사 완료','친구에게 게임 링크를 붙여 넣어 공유해 주세요.');}
        catch {showNotice('게임 링크 공유','아래 링크를 선택해 복사해 주세요.',SHARE_URL);}
      };
      const install=document.getElementById('btn-install');
      if(install) install.onclick=async()=>{
        if(matchMedia('(display-mode: standalone)').matches || navigator.standalone) {showNotice('설치된 앱','이미 홈화면 앱으로 실행 중입니다.');return;}
        if(installPrompt){try {const prompt=installPrompt;installPrompt=null;await prompt.prompt();const result=await prompt.userChoice;if(result.outcome==='accepted')showNotice('설치 요청 완료','브라우저에서 설치가 끝나면 홈화면 아이콘으로 실행해 주세요.');}catch{showNotice('홈화면 설치','브라우저 메뉴에서 앱 설치 또는 홈화면에 추가를 선택해 주세요.');}return;}
        const ios=/iPad|iPhone|iPod/.test(navigator.userAgent);
        showNotice('홈화면에 설치',ios?'Safari에서 공유 버튼을 누른 뒤 ‘홈 화면에 추가’를 선택하세요.':'Chrome 또는 Edge의 메뉴에서 ‘앱 설치’ 또는 ‘홈 화면에 추가’를 선택하세요. 메뉴가 없으면 공식 게임 주소를 기본 브라우저로 열어 주세요.');
      };
    }

    document.addEventListener('fullscreenchange', () => {
      const button = document.getElementById('btn-fullscreen');
      if (button) button.textContent = document.fullscreenElement ? '⛶ 전체화면 나가기' : '⛶ 전체화면';
    });

    document.addEventListener('keydown', event => {
      if (gameState.screen !== 'play' || event.repeat || event.ctrlKey || event.altKey || event.metaKey) return;
      const key = event.key.toLowerCase();
      const player = key === 'a' ? 'p1' : key === 'l' ? 'p2' : null;
      const el = player ? document.getElementById('pad-' + player) : document.activeElement;
      if (el?.classList.contains('pad') && (player || key === 'enter' || key === ' ')) {
        event.preventDefault(); el.onpointerdown?.();
      }
    });

    // ----- HTML 이스케이프 (이름 입력값 안전 처리) -----
    function esc(s) {
      return String(s).replace(/[&<>"']/g, (c) => ({
        '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;',
      }[c]));
    }

    // 음소거 토글 버튼 (앱 위에 고정, 한 번만 생성)
    const muteBtn = document.createElement('button');
    muteBtn.id = 'btn-mute';
    muteBtn.textContent = '🔊';
    muteBtn.setAttribute('aria-label', '소리 켜기/끄기');
    muteBtn.onclick = () => { muteBtn.textContent = Sound.toggle() ? '🔇' : '🔊'; };
    app.appendChild(muteBtn);

    render();
  </script>
</body>
</html>
